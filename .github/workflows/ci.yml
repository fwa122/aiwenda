name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-unit:
    name: Server 单元测试 (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run test:cov

  server-e2e:
    name: Server 集成测试 (auth 链路)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Docker Hub 对 GH Actions 共享出口 IP 的匿名拉取限流近期持续拒绝（0.3s 即 denied，
      # 重试无效）：MinIO 官方在 quay.io 同源发布，CI 预拉后打回原 tag，
      # compose 文件与本地 e2e（pgvector/redis 走 Docker Hub 正常）均不受影响
      - name: 预拉 MinIO 镜像（quay.io 绕开 Docker Hub 匿名限流）
        run: |
          docker pull quay.io/minio/minio:latest
          docker tag quay.io/minio/minio:latest minio/minio:latest
      - name: 启动测试容器（独立 Postgres/Redis/MinIO）
        run: docker compose -f docker-compose.test.yml up -d
      - run: npm run test:e2e:cov

  ai-service:
    name: AI 服务测试 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: 前端测试与构建 (vitest + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 前端单元测试（jsdom）
        run: npm test
      - name: 前端构建
        run: npm run build
