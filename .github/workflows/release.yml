name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: 构建并推送三镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: server 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            gujinyi666/aiwenda-server:latest
            gujinyi666/aiwenda-server:${{ github.ref_name }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: frontend 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            gujinyi666/aiwenda-frontend:latest
            gujinyi666/aiwenda-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: ai-service 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: |
            gujinyi666/aiwenda-ai:latest
            gujinyi666/aiwenda-ai:${{ github.ref_name }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

  release:
    name: 创建 GitHub Release
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 生成 Release（notes 自动取 tag 区间提交）
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
