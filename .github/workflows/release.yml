name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: 构建并推送三镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: server 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            gujinyi666/aiwenda-server:latest
            gujinyi666/aiwenda-server:${{ github.ref_name }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: frontend 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            gujinyi666/aiwenda-frontend:latest
            gujinyi666/aiwenda-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: ai-service 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./ai-service
          push: true
          tags: |
            gujinyi666/aiwenda-ai:latest
            gujinyi666/aiwenda-ai:${{ github.ref_name }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

  release:
    name: 创建 GitHub Release
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 生成 Release（notes 自动取 tag 区间提交）
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: 部署到云服务器（拉取镜像并重建）
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 拉取部署
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/aiwenda
            # 只拉会变的三个镜像（worker 与 ai-service 同镜像；pg/redis/minio 数据服务不动）
            docker compose -f docker-compose.prod.yml pull server nginx ai-service
            # server 入口自带 prisma migrate deploy（唯一 DDL 通道，见 v0.9.64 教训）
            docker compose -f docker-compose.prod.yml up -d server nginx ai-service worker
            sleep 15
            curl -fsS -m 30 http://localhost:8080/ >/dev/null
            echo "DEPLOY_OK"
            docker ps --format '{{.Names}} {{.Status}}' | grep -E 'server|nginx|ai-service|worker'
