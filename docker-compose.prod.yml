# AI 知识库问答系统 · 镜像部署编排（免构建，适合分享/服务器快速部署）
#
# 与 docker-compose.yml 的区别：所有自建服务直接拉取 Docker Hub 上的现成镜像，
# 无需 Node/Python 环境与源码构建。postgres/redis 为公共镜像，自动拉取。
#
# 使用（先完成一次 clone 获得 nginx/ 配置与 .env 模板）：
#   1. git clone https://github.com/fwa122/aiwenda.git && cd aiwenda
#   2. cp .env.docker.example .env 并填入密钥（JWT_SECRET / INTERNAL_TOKEN / ZHIPU_API_KEY 等）
#   3. docker compose -f docker-compose.prod.yml pull
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. 浏览器访问 http://<主机IP>/（默认 80 端口，被占用可在 .env 设 NGINX_PORT）
#
# 更新版本：
#   git pull && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

name: kb-prod

# 统一日志轮转：json-file 默认无限增长，长期运行会撑爆宿主磁盘（单容器上限 3×10MB）
x-logging: &default_logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ────────────────────────── 入口层 ──────────────────────────
  nginx:
    <<: *default_logging
    image: gujinyi666/aiwenda-frontend:latest
    ports:
      - "${NGINX_PORT:-80}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ────────────────────────── 应用层 ──────────────────────────
  server:
    <<: *default_logging
    image: gujinyi666/aiwenda-server:latest
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kb}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-120m}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TOKEN=${INTERNAL_TOKEN}
      - AI_MOCK=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # 首次启动 seed admin 账号用的初始密码（未配置时 seed 跳过 admin 播种）
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      # MinIO 对象存储（server 上传/预览/删除文档对象；启动时自动建桶）
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER 未配置}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未配置}
      - MINIO_BUCKET=${MINIO_BUCKET:-kb-documents}
      - MINIO_SECURE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/user/profile').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  ai-service:
    <<: *default_logging
    image: gujinyi666/aiwenda-ai:latest
    environment: &ai_env
      # ⚠️ 本块必须与 docker-compose.yml 的 ai-service environment 保持一致（历史教训：
      # 双手工维护曾漂移漏掉 QIANWEN_* / EMBEDDING_MODEL，导致免构建部署嵌入渠道失效）
      - TZ=Asia/Shanghai
      # 智谱 BigModel（生成+向量+rerank+OCR）
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      # Moonshot Kimi（可选生成模型）
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - MOONSHOT_BASE_URL=${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1}
      - MOONSHOT_THINKING=${MOONSHOT_THINKING:-disabled}
      # Qianwen / DashScope（生成 + 向量）
      - QIANWEN_API_KEY=${QIANWEN_API_KEY}
      - QIANWEN_BASE_URL=${QIANWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 向量 / 默认生成参数
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-zhipu}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-3}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      # 轻量任务模型（改写/建议/命名）：空值跟随 LLM_MODEL 渠道
      - FLASH_MODEL=${FLASH_MODEL:-}
      # 扫描件 OCR
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-20}
      # 基础设施（容器网络服务名）
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kb}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      # MinIO（worker 解析前从桶拉取原始文档到临时文件）
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER 未配置}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未配置}
      - MINIO_BUCKET=${MINIO_BUCKET:-kb-documents}
      - MINIO_SECURE=false
      # 内部令牌（与 server 的 AI_SERVICE_TOKEN 同值，fail-closed）
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Celery worker：与 ai-service 同镜像，消费解析任务；
  # -B 内嵌 beat（单实例标准做法），周期调度对账任务恢复卡死文档；
  # 原始文档从 MinIO 桶拉取，无需挂载共享磁盘卷
  worker:
    <<: *default_logging
    image: gujinyi666/aiwenda-ai:latest
    command: celery -A app.tasks worker -B --loglevel=info --concurrency=2
    environment: *ai_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '2.0'

  # ────────────────────────── 基础设施层 ──────────────────────────
  postgres:
    <<: *default_logging
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-kb}
      - TZ=Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb} -d ${POSTGRES_DB:-kb}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  redis:
    <<: *default_logging
    image: redis:7-alpine
    # requirepass 必填（:? 缺失时 compose 直接报错，fail-fast）：
    # Redis 未授权访问是经典入侵入口，且该实例是 Celery broker
    # maxmemory + noeviction：内存防膨胀；broker 任务键无 TTL，eviction 会丢任务，
    # noeviction 写满时报错（任务提交失败可见）优于静默丢数据
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD 未配置}', '--maxmemory', '200mb', '--maxmemory-policy', 'noeviction']
    environment:
      # 供 healthcheck 内 redis-cli 鉴权使用（$$ 转义为容器内变量，不落宿主进程列表）
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 未配置}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # MinIO（S3 兼容对象存储）：上传原始文档的唯一存储后端。
  # 桶由 server 启动时自动创建；端口不映射宿主机（对齐 postgres/redis 纯内网策略）
  # 镜像说明：MinIO Inc. 已停止发布官方镜像并于 2026-09-11 删除 Docker Hub 上的
  # minio/minio 仓库（新环境部署/重建容器会 pull 失败）；pgsty/minio 为社区维护
  # fork（基于最后上游版本重建，命令与环境变量与官方完全兼容，含 console）
  minio:
    <<: *default_logging
    image: pgsty/minio:latest
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER 未配置}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未配置}
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

volumes:
  pg_data:
  redis_data:
  minio_data:
