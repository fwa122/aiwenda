# AI 知识库问答系统 · 全栈生产编排（A+A 方案：单文件 + 前端多阶段进镜像）
#
# 使用：
#   1. cp .env.docker.example .env 并填入密钥（JWT_SECRET / INTERNAL_TOKEN / API Key 等）
#   2. docker compose up -d --build
#   3. 浏览器访问 http://<主机IP>/（NGINX_PORT 可改端口）
#
# 说明：
#   - 与本地开发的 docker-compose.infra.yml 通过 project name（kb-prod）隔离，互不影响
#   - postgres/redis/minio/ai-service 均不映射宿主端口，仅容器网络内可达
#   - 上传文档统一存 MinIO 桶（server 写入 / worker 读取，无共享磁盘卷）

name: kb-prod

services:
  # ────────────────────────── 入口层 ──────────────────────────
  nginx:
    build: ./frontend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

  # ────────────────────────── 应用层 ──────────────────────────
  server:
    build: ./server
    image: kb-server:latest
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kb}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-120m}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TOKEN=${INTERNAL_TOKEN}
      - AI_MOCK=false
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      # 首次启动 seed admin 账号用的初始密码（未配置时 seed 跳过 admin 播种）
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      # MinIO 对象存储（server 上传/预览/删除文档对象；启动时自动建桶）
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER 未配置}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未配置}
      - MINIO_BUCKET=${MINIO_BUCKET:-kb-documents}
      - MINIO_SECURE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/user/profile').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    image: kb-ai-service:latest
    environment: &ai_env
      # ⚠️ 本块必须与 docker-compose.prod.yml 的 ai-service environment 保持一致（历史教训：
      # 双手工维护曾漂移漏掉 QIANWEN_* / EMBEDDING_MODEL，导致免构建部署嵌入渠道失效）
      - TZ=Asia/Shanghai
      # 智谱 BigModel（生成+向量+rerank+OCR）
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      # Moonshot Kimi（可选生成模型）
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - MOONSHOT_BASE_URL=${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1}
      - MOONSHOT_THINKING=${MOONSHOT_THINKING:-disabled}
      # Qianwen / DashScope（生成 + 向量）
      - QIANWEN_API_KEY=${QIANWEN_API_KEY}
      - QIANWEN_BASE_URL=${QIANWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 向量 / 默认生成参数
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-zhipu}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-3}
      - LLM_MODEL=${LLM_MODEL:-glm-4-flash}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      # 扫描件 OCR
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-20}
      # 基础设施（容器网络服务名）
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kb}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      # MinIO（worker 解析前从桶拉取原始文档到临时文件）
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER 未配置}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未配置}
      - MINIO_BUCKET=${MINIO_BUCKET:-kb-documents}
      - MINIO_SECURE=false
      # 内部令牌（与 server 的 AI_SERVICE_TOKEN 同值，fail-closed）
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Celery worker：与 ai-service 同镜像，消费解析任务；
  # -B 内嵌 beat（单实例标准做法），周期调度对账任务恢复卡死文档；
  # 原始文档从 MinIO 桶拉取，无需挂载共享磁盘卷
  worker:
    image: kb-ai-service:latest
    command: celery -A app.tasks worker -B --loglevel=info --concurrency=2
    environment: *ai_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ────────────────────────── 基础设施层 ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-kb}
      - TZ=Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb} -d ${POSTGRES_DB:-kb}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # requirepass 必填（:? 缺失时 compose 直接报错，fail-fast）：
    # Redis 未授权访问是经典入侵入口，且该实例是 Celery broker
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD 未配置}']
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MinIO（S3 兼容对象存储）：上传原始文档的唯一存储后端。
  # 桶由 server 启动时自动创建；端口不映射宿主机（对齐 postgres/redis 纯内网策略）
  minio:
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER 未配置}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未配置}
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
