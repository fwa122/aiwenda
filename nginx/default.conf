# AI 知识库问答系统 · 前端托管 + API 反向代理
# 要点：SSE 必须关缓冲；上传 10×20MB + base64 附件需放宽 body 限制

server {
    listen 80;
    server_name _;

    # 多文件上传（一次最多 10 × 20MB）与 base64 附件（≤12MB JSON）
    client_max_body_size 256m;

    # 前端静态资源（Vue Router history 模式回退 index.html）
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 assets）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到 Node BFF（/api/v1/* 路径原样透传）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置：关缓冲，流式响应不被攒成一次性返回
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
