# AI 知识库问答系统 · 前端托管 + API 反向代理
# 要点：SSE 必须关缓冲；上传 10×20MB + base64 附件需放宽 body 限制

# 监听 8080：运行镜像为官方非 root 变体 nginx-unprivileged（uid 101 无法绑 <1024 端口），
# 宿主端口由 compose 端口映射决定（默认仍为 80→8080）
server {
    listen 8080;
    server_name _;

    # 多文件上传（一次最多 10 × 20MB）与 base64 附件（≤12MB JSON）
    client_max_body_size 256m;

    # 隐藏 nginx 版本号，减少指纹信息
    server_tokens off;

    # ──────────── gzip 压缩：文本类响应传输体积降 60%~80% ────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    # 刻意不含 text/event-stream：SSE 流式问答不压缩，避免攒包影响打字机效果
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    # ──────────── 安全响应头 ────────────
    # X-Frame-Options 用 SAMEORIGIN 而非 DENY：文档预览 iframe 同源加载
    # /api/v1/documents/:docId/file，DENY 会打断预览功能
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # 前端静态资源（Vue Router history 模式回退 index.html）
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 assets）
    # 注意：nginx 的 add_header 不跨层继承——此 location 出现自己的 add_header 后，
    # server 级安全头对它全部失效，必须在此重复声明
    location /assets/ {
        # 单条 Cache-Control：expires 指令与 add_header 并用会产生重复头
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # 入口页禁缓存：发版后浏览器必须立刻拿到新 index.html（资产文件名带 hash，
    # 新入口页会自动引用新资产）。否则用户可能长期停留在旧版本。
    # add_header 不跨层继承——此处出现 add_header 后需重复声明安全头
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # API 反代到 Node BFF（/api/v1/* 路径原样透传）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置：关缓冲，流式响应不被攒成一次性返回
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
